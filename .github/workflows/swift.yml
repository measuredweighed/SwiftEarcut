name: Swift Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.configuration }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c ${{ matrix.configuration }}
      - run: swift test -c ${{ matrix.configuration }}

  arena-safety:
    name: Arena pointer safety (ASan)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # EARCUT_STRESS_ARENA reallocates the node arena on every reserve, so any pointer
      # held across one surfaces here as a use-after-free rather than silently working.
      - run: swift test --sanitize=address -Xswiftc -DEARCUT_STRESS_ARENA

  benchmark:
    name: Benchmark
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift run -c release SwiftEarcutBench --quick
